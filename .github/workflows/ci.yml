name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Node ${{ matrix.node }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify Node version
        run: node --version

      - name: Syntax check - hooks
        run: |
          node --check hooks/session-recall.js
          node --check hooks/prompt-recall.js
          node --check hooks/session-capture.js

      - name: Syntax check - scripts
        run: |
          node --check scripts/build-index.js
          node --check scripts/transcript-digest.js
          node --check scripts/doctor.js

      - name: Run test suite
        # default discovery finds tests/*.test.js on all supported Node versions.
        # No "|| true": a failing test must fail CI.
        run: node --test

      - name: Doctor smoke-check (Unix)
        if: runner.os != 'Windows'
        run: node scripts/doctor.js --memory-dir /tmp/agent-memory-ci || true

      - name: Doctor smoke-check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/doctor.js --memory-dir $env:TEMP\agent-memory-ci; exit 0

      - name: Syntax check - Codex adapters
        run: |
          node --check integrations/codex-session-recall-adapter.js
          node --check integrations/codex-prompt-recall-adapter.js

  python-rag:
    name: "Python RAG layer on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check (Unix)
        if: runner.os != 'Windows'
        run: python -m py_compile scripts/rag/*.py

      - name: Compile check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem scripts/rag/*.py | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }

      - name: PII routing self-test
        run: python scripts/rag/pii_route.py --selftest
