name: process-artifact-guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block process artifacts in added or modified files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pattern='(^|/)(\.harness|\.loops|\.supergoal|\.run|\.e2e|vite-cache|scratchpad|\.tmp[^/]*)/|(^|/)docs/(overdracht|tasks|specs|superplan)/|(^|/)docs/plan-[^/]*\.md$'
          # Product inside those folders: the project-structure check and the e2e replay cache.
          allowed='(^|/)\.harness/projectstructuur/|(^|/)\.e2e/cache/'
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git merge-base "$head" "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
              if [ -z "$base" ] || [ "$base" = "$head" ]; then
                base=$(git rev-parse --verify --quiet "$head^" || echo "$empty_tree")
              fi
            fi
          fi
          if [ "$base" = "$empty_tree" ]; then
            files=$(git -c core.quotePath=false diff --name-only --diff-filter=d "$base" "$head")
          else
            files=$(git -c core.quotePath=false diff --name-only --diff-filter=d "$base...$head")
          fi
          hits=$(printf '%s\n' "$files" | grep -Ei "$pattern" | grep -Eiv "$allowed" || true)
          if [ -n "$hits" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::Process artifact, keep it local: $f"
            done <<< "$hits"
            exit 1
          fi
          echo "No process artifacts in $base..$head"
